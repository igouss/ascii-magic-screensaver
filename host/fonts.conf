<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The system's fonts, plus: upstream draws in Menlo first, and without Menlo
  fontconfig falls back to a proportional sans, whose wide glyphs overflow
  their cells (an O is clipped to a C). Menlo here means the monospace font.
-->
<fontconfig>
  <!-- Before the system's rules, which would add sans-serif to an unknown family. -->
  <match target="pattern">
    <test name="family"><string>Menlo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>monospace</string></edit>
  </match>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
